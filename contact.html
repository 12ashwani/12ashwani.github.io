<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - Ashwani Kumar</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://unpkg.com/scrollreveal"></script>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-white to-teal-100 text-gray-900 font-sans">

  <!-- Navbar -->
  <nav class="bg-emerald-600 shadow-lg fixed w-full top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold text-white">Ashwani Kumar</h1>
      <div class="space-x-6">
        <a href="index.html" class="text-white hover:text-yellow-200">Home</a>
        <a href="exp.html" class="text-white hover:text-yellow-200">Experience</a>
        <a href="edu.html" class="text-white hover:text-yellow-200">Education</a>
        <a href="projects.html" class="text-white hover:text-yellow-200">Projects</a>
        <a href="contact.html" class="text-yellow-200 font-bold">Contact</a>
      </div>
    </div>
  </nav>

  <!-- Contact Section -->
  <section id="contact" class="min-h-screen flex flex-col justify-center items-center bg-gradient-to-r from-emerald-500 to-green-600 text-white px-6 py-24">
    <h2 class="text-4xl font-bold mb-6" data-sr>Contact Me</h2>
    <p class="mb-12 max-w-xl text-lg text-center" data-sr>
      Got a project idea, collaboration, or just want to say hello?  
      Fill the form below — I’ll get back to you soon.
    </p>

    <!-- Contact Form -->
    <div class="max-w-2xl w-full mx-auto bg-white shadow-xl rounded-xl p-8" data-sr>
      <form id="contact-form" class="space-y-6">
        <div>
          <label class="block text-left font-semibold text-gray-700">Your Name</label>
          <input type="text" name="from_name" 
            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-emerald-700" 
            required>
        </div>
        <div>
          <label class="block text-left font-semibold text-gray-700">Your Email</label>
          <input type="email" name="reply_to" 
            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-emerald-700" 
            required>
        </div>
        <div>
          <label class="block text-left font-semibold text-gray-700">Your Message</label>
          <textarea name="message" rows="4" 
            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-emerald-700" 
            required></textarea>
        </div>
        <button type="submit" 
          class="w-full bg-emerald-600 text-white font-semibold py-3 rounded-lg transform transition duration-300 hover:bg-emerald-700 hover:scale-105 shadow-md hover:shadow-xl">
          Send Message
        </button>
      </form>
    </div>

    <!-- Social Links -->
    <div class="max-w-4xl mx-auto text-center mt-12 space-x-6" data-sr>
      <a href="https://www.linkedin.com/in/ashwani-kumar-4aa519149/" target="_blank" 
         class="text-white hover:text-yellow-200 text-3xl inline-block transform transition duration-300 hover:scale-125">
        <i class="fab fa-linkedin"></i>
      </a>
      <a href="https://github.com/12ashwani" target="_blank" 
         class="text-white hover:text-yellow-200 text-3xl inline-block transform transition duration-300 hover:scale-125">
        <i class="fab fa-github"></i>
      </a>
      <a href="#" target="_blank" 
         class="text-white hover:text-yellow-200 text-3xl inline-block transform transition duration-300 hover:scale-125">
        <i class="fab fa-twitter"></i>
      </a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-emerald-600 py-6 text-center text-white text-sm">
    © 2025 Ashwani Kumar. All rights reserved.
  </footer>

  <!-- Font Awesome for Social Icons -->
  <script src="https://kit.fontawesome.com/a2e0e6ad65.js" crossorigin="anonymous"></script>

  <!-- EmailJS Script -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("YOUR_PUBLIC_KEY"); // 🔑 यहां अपनी EmailJS Public Key डालें
    })();

    document.getElementById('contact-form').addEventListener('submit', function(event) {
      event.preventDefault();

      emailjs.sendForm('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', this)
        .then(function() {
          alert('✅ Message sent successfully!');
        }, function(error) {
          alert('❌ Failed to send message. Please try again.');
          console.error(error);
        });
    });

    // ScrollReveal animations
    ScrollReveal().reveal('[data-sr]', {
      distance: '40px',
      duration: 1000,
      easing: 'ease-out',
      origin: 'bottom',
      interval: 200
    });
  </script>
</body>
</html>
